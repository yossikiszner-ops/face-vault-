name: Install Face Vault

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project files
        env:
          FACE_VAULT_FILES: '{".env.example":"QVBQX1BBU1NXT1JEPWNob29zZS1hLXN0cm9uZy1wYXNzd29yZApBVVRIX1NFQ1JFVD1nZW5lcmF0ZS1hLWxvbmctcmFuZG9tLXNlY3JldApVUFNUQVNIX1JFRElTX1JFU1RfVVJMPQpVUFNUQVNIX1JFRElTX1JFU1RfVE9LRU49Cg==",".gitignore":"bm9kZV9tb2R1bGVzCi5uZXh0Ci5lbnYKLmVudi5sb2NhbApwdWJsaWMvbW9kZWxzCioubG9nCg==","README.md":"","app/api/auth/login/route.ts":"","app/api/auth/logout/route.ts":"aW1wb3J0e05leHRSZXNwb25zZX1mcm9tIm5leHQvc2VydmVyIjtpbXBvcnR7Q09PS0lFfWZyb20iQC9saWIvYXV0aCI7ZXhwb3J0IGFzeW5jIGZ1bmN0aW9uIFBPU1QoKXtjb25zdCByPU5leHRSZXNwb25zZS5qc29uKHtvazp0cnVlfSk7ci5jb29raWVzLnNldChDT09LSUUsIiIse3BhdGg6Ii8iLG1heEFnZTowfSk7cmV0dXJuIHJ9Cg==","app/api/auth/session/route.ts":"aW1wb3J0e05leHRSZXNwb25zZX1mcm9tIm5leHQvc2VydmVyIjtpbXBvcnR7YXV0aG9yaXplZH1mcm9tIkAvbGliL2F1dGgiO2V4cG9ydCBhc3luYyBmdW5jdGlvbiBHRVQoKXtyZXR1cm4gTmV4dFJlc3BvbnNlLmpzb24oe2F1dGhlbnRpY2F0ZWQ6YXdhaXQgYXV0aG9yaXplZCgpfSl9Cg==","app/api/embeddings/route.ts":"","app/api/people/[id]/samples/route.ts":"","app/api/people/route.ts":"","app/globals.css":"","app/layout.tsx":"","app/page.tsx":"","lib/auth.ts":"","lib/store.ts":"","next-env.d.ts":"","next.config.mjs":"LyoqIEB0eXBlIHtpbXBvcnQoJ25leHQnKS5OZXh0Q29uZmlnfSAqLwpjb25zdCBuZXh0Q29uZmlnPXt9OyBleHBvcnQgZGVmYXVsdCBuZXh0Q29uZmlnOwo=","package-lock.json":"","package.json":"","scripts/copy-models.mjs":"","tsconfig.json":""}'
        run: |
          python3 - <<'PY'
          import os, json, base64
          files = json.loads(os.environ["FACE_VAULT_FILES"])
          for path, encoded in files.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "wb") as f:
                  f.write(base64.b64decode(encoded))
          PY

      - name: Remove installer and commit project
        run: |
          rm -f .github/workflows/bootstrap.yml
          git config user.name "Face Vault Installer"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Install Face Vault application"
          git push
